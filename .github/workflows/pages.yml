name: pages

# The website (site/): the landing page and docs at https://omp-cloud.techdufus.com, rebuilt from main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "install.sh"
      - "bun.lock"
      - "src/dashboard/client/kit/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages and the links the site advertises need a public repository:
    # while it is private the jobs are skipped, not failed.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The canonical, sitemap and 404 URLs use the address Pages serves the site at now:
      # https://techdufus.com/omp-cloud until the custom domain is set, then that domain.
      # Re-run this workflow after changing the custom domain. Pages reports http:// for a
      # site under a custom-domain user site, but the site is served over https (an http
      # <base> would make the 404 page's stylesheet mixed content), hence the upgrade.
      - id: pages
        uses: actions/configure-pages@v6
      - env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bun run site/build.ts --out site/dist --site-url "${BASE_URL/#http:\/\//https://}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
