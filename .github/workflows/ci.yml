name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Unit tests run `omp session pack` and friends: they need the pinned omp on PATH.
      - uses: ./.github/actions/install-omp
      - name: Typecheck
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p src/dashboard/client
          bunx tsc --noEmit -p site
      # The website (site/): fails on any broken internal link or anchor in docs/, README.md or CHANGELOG.md.
      - name: Site
        run: bun run site/build.ts --out "$RUNNER_TEMP/site"
      # Unit tests only: the scenarios and the smoke test need vmon (KVM) and a model.
      # --parallel runs one worker per vCPU; --no-isolate lets each worker keep one global across its files, as the
      # single-process `bun test` did for all of them.
      - name: Test
        run: bun test --parallel --no-isolate
